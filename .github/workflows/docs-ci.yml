name: Documentation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate Interactive Lab release scope and package
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${CI_BASE_SHA}...${CI_HEAD_SHA}")"
          # Here-string, not a pipe: with pipefail an early grep -q exit would SIGPIPE the writer and skip the check.
          scope=0
          grep -Eq '^(\.github/workflows/(interactive-lab-pages|docs-ci)\.yml|exploration/5g-sdr-interactive-lab/)' <<<"$changed" || scope=$?
          # Fail closed: only grep's "no match" (1) may skip; any other status is an error.
          if [[ "$scope" -eq 1 ]]; then
            echo 'No Interactive Lab Pages changes; package check skipped.'
            exit 0
          elif [[ "$scope" -ne 0 ]]; then
            echo "Could not determine Interactive Lab change scope (grep exit $scope)." >&2
            exit 1
          fi
          site=exploration/5g-sdr-interactive-lab
          test -f "$site/index.html"
          test -f "$site/evidence.html"
          test -f "$site/lab03-ota.html"
          test -d "$site/css"
          test -d "$site/js"
          test -d "$site/assets"
          find "$site/js" -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          artifact="$RUNNER_TEMP/interactive-lab-site-pr-check"
          mkdir -p "$artifact"
          cp "$site/index.html" "$site/evidence.html" "$site/lab03-ota.html" "$artifact/"
          cp -R "$site/css" "$site/js" "$site/assets" "$artifact/"
          find "$artifact" -type f -name '.DS_Store' -delete
          touch "$artifact/.nojekyll"
          test ! -e "$artifact/README.md"
          test ! -e "$artifact/review"
          for entry in "$artifact"/* "$artifact"/.[!.]*; do
            [[ -e "$entry" ]] || continue
            case "${entry##*/}" in
              .nojekyll|assets|css|evidence.html|index.html|js|lab03-ota.html)
                ;;
              *)
                echo "Unexpected item in Pages artifact: ${entry##*/}" >&2
                exit 1
                ;;
            esac
          done
          for entry in .nojekyll assets css evidence.html index.html js lab03-ota.html; do
            test -e "$artifact/$entry"
          done
          if find "$artifact" -type f -name '.DS_Store' -print -quit | grep -q .; then
            echo 'Unexpected .DS_Store in Pages artifact' >&2
            exit 1
          fi
      - name: Install locked linters
        run: |
          npm ci --prefix .github/ci --ignore-scripts --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/docs-ci-venv"
          "$RUNNER_TEMP/docs-ci-venv/bin/python" -m pip install --require-hashes -r .github/ci/requirements.txt
          echo "$RUNNER_TEMP/docs-ci-venv/bin" >> "$GITHUB_PATH"
      - name: Install verified binaries for check regression tests
        run: |
          python3 .github/ci/install_tools.py lychee "$RUNNER_TEMP/docs-ci-bin"
          python3 .github/ci/install_tools.py gitleaks "$RUNNER_TEMP/docs-ci-bin"
          echo "$RUNNER_TEMP/docs-ci-bin" >> "$GITHUB_PATH"
      - name: Verify failure detection in temporary repositories
        run: |
          python3 .github/ci/test_checks.py
          python3 .github/ci/test_interactive_lab_pages.py
      - name: Test Lab03 dual-path tools and results-page loader
        run: |
          # Both interpreter modes: parameter validation must not depend on assert.
          python3 -B exploration/lab03-dualpath-tools/test_live_viz.py
          python3 -B -O exploration/lab03-dualpath-tools/test_live_viz.py
          node exploration/lab03-dualpath-tools/test_lab03_ota_run.mjs
      - name: Check documentation and PR whitespace
        run: python3 .github/ci/checks.py docs-quality

  local-links:
    name: local-links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified lychee binary
        run: |
          python3 .github/ci/install_tools.py lychee "$RUNNER_TEMP/docs-ci-bin"
          echo "$RUNNER_TEMP/docs-ci-bin" >> "$GITHUB_PATH"
      - name: Check all local document links
        run: python3 .github/ci/checks.py local-links

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        run: |
          python3 .github/ci/install_tools.py gitleaks "$RUNNER_TEMP/docs-ci-bin"
          echo "$RUNNER_TEMP/docs-ci-bin" >> "$GITHUB_PATH"
      - name: Scan current files and introduced commits
        run: python3 .github/ci/checks.py secret-scan
