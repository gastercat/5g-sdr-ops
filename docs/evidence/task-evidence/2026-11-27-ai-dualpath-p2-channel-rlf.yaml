evidence:
  - evidence_id: "P2-01"
    claim: "Linux2 的 srsue 支援 channel.dl.rlf；中斷期間下行樣本被乘以 0。"
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: "09:10Z srsue --help：--channel.dl.enable (=0)、--channel.dl.rlf.enable (=0)、--channel.dl.rlf.t_on_ms (=10000)、--channel.dl.rlf.t_off_ms (=2000)。lib/src/phy/channel/rlf.c 的 srsran_channel_rlf_execute：以樣本時間戳計算 period = t_on + t_off 內的位置，time_ms < t_on 時樣本乘以 1.0，否則乘以 0.0。"
    directness: "PRIMARY"
    confidence: "高"
    source_location: "Repo 外 2026-11-27-AI-Dualpath-P2-channel-rlf/step0-readonly.txt"
    limitations:
      - "t_off_ms 預設 2000 ms，每次都必須明確指定。"
  - evidence_id: "P2-02"
    claim: "未注入時路徑 A 正常。"
    evidence_type: "FILE_ARTIFACT"
    exact_observation: "09:13:15Z–09:14:34Z，control-base（沿用上午的 srsue 7726，tun_srsue 172.16.0.4）：only_a 3000／3000，30 ms 期限內 99.433%。"
    directness: "PRIMARY"
    confidence: "高"
    source_location: "Repo 外 run/control-base.sender.jsonl、step3-control.txt"
    limitations:
      - "沿用上午的 Runtime，略過 15 分鐘觀察期（Owner 核准）。"
  - evidence_id: "P2-03"
    claim: "每 10 秒中斷 50 ms 的下行，使路徑 A 在第二次中斷後完全中斷。"
    evidence_type: "FILE_ARTIFACT"
    exact_observation: "srsue 13452 以 --channel.dl.enable=true --channel.dl.rlf.enable=true --channel.dl.rlf.t_on_ms=10000 --channel.dl.rlf.t_off_ms=50 重啟（tun_srsue 172.16.0.5）。09:18:38Z–09:19:57Z probe-off50：only_a 800／3000，30 ms 期限內 25.9%。以送出時間計：0–6.42 s 正常；6.44–7.18 s 三段共 23 個封包遺失；7.20–16.49 s 正常；16.51 s 起到 60.19 s 共 2177 個封包全部遺失。Owner 回報啟動後終端機出現兩次 O=0, U=1, L=0。"
    directness: "PRIMARY"
    confidence: "高（觀察）"
    source_location: "Repo 外 run/probe-off50.sender.jsonl、step4-probe-off50.txt"
    limitations:
      - "單一試次；只試了 50 ms，沒有更短或更長的值。"
  - evidence_id: "P2-04"
    claim: "原因是 eNB 給的 RLF 計時器極短：一次失步就在 200 ms 後判定無線連結失敗；第二次中斷後 UE 隨機存取失敗。"
    evidence_type: "LOG"
    exact_observation: "/tmp/ue-p2-off50.log：Set Constants and Timers: N310=1, N311=1, t300=2000, t301=100, t310=200, t311=10000。09:16:55Z（探測前）第一次中斷：PSS/SSS out-of-sync、SNR 降到約 -20 dB、T310 expired: Radio Link Failure、重建要求後 Selected cell no longer suitable: Going to RRC IDLE。探測中 09:18:46Z：T310 expired → RLF → RRC Connection Reestablishment 約 35 ms 完成。09:18:56Z：out-of-sync／in-sync 反覆、T310 多次啟動與停止；09:18:57Z、09:18:58Z MAC [E] RA: Maximum number of transmissions reached (10)。紀錄共 302724 行 [W]，檔案約 55 MB。"
    directness: "PRIMARY"
    confidence: "中高；摘錄自原始紀錄，原始檔未保存。"
    source_location: "Repo 外 step4-probe-off50.txt（Agent 讀取時的摘錄）"
    limitations:
      - "原始紀錄在取回前已於主機上刪除（見 P2-06），只能以摘錄為準。"
      - "第二次中斷後為何無法重新同步（例如時序或頻率偏移追蹤）沒有查證。"
  - evidence_id: "P2-05"
    claim: "移除中斷參數後 UE 仍無法 Attach，需重啟整組 Runtime 才恢復。"
    evidence_type: "LOG"
    exact_observation: "srsue 13746 於 09:24:48Z 以不含 --channel.* 的指令重啟。/tmp/ue-p2-restore.log：09:26:33Z NAS [W] Timer T3410 expired after attach attempt 4/5；09:26:48Z 以 GUTI（m_tmsi 6c21d440，與 off50 那次相同）送出 Attach Request，RRC 連線建立完成但沒有 Attach Accept；09:27:18Z 收到 rrcConnectionRelease；RSRP 約 -69.5 dBm；沒有 [E]。17:25、17:27 CST tun_srsue 不存在。Owner 依 Lab03 順序重啟 UE、eNB、EPC 後，09:35:26Z tun_srsue 172.16.0.2、srsepc 46068、srsenb 46083；09:35:32Z restore-check 300／300，期限內 99.667%。"
    directness: "PRIMARY"
    confidence: "高（觀察）；Attach 卡住的原因未確認。"
    source_location: "Repo 外 step4-restore-stop.txt、run/restore-check.sender.jsonl"
    limitations:
      - "EPC 端是否殘留舊的 UE context 只是推測，沒有讀 EPC 紀錄。"
  - evidence_id: "P2-06"
    claim: "UE 原始紀錄在取回前被刪除。"
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: "Owner 核准取回 /tmp/ue-p2-off50.log 並刪除 /tmp/ue.log。09:42Z sha256sum 回報檔案不存在；/tmp/ue*.log 皆不存在（ue-p2-off50.log、ue-p2-restore.log、ue.log 已由現場刪除）。原因是 Agent 在同一則訊息裡同時列出取回與刪除指令，現場依序貼上執行。srsue 14160 仍在寫入已刪除的 restore 紀錄，直到停止。"
    directness: "PRIMARY"
    confidence: "高"
    source_location: "Repo 外 step4-restore-stop.txt"
    limitations: []

