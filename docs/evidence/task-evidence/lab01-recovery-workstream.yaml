evidence:
  - evidence_id: "E01"
    claim: "Mac switch-side management IPv4 historically existed on en5."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      Gate A ifconfig output showed en5 with inet 192.168.250.10,
      netmask 0xffffff00, and broadcast 192.168.250.255.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Recovered Codex records supplied during Part 6"
    limitations:
      - "Proves the address existed at the historical observation time only."
      - "Configuration method, Network Service name, and reconnect/reboot persistence were not found."

  - evidence_id: "E02"
    claim: "Linux1 and Linux2 management addresses and restricted SSH reachability were observed."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      Restricted SSH audit commands succeeded from Mac. Linux1 showed
      192.168.250.11/24 with a directly connected 192.168.250.0/24 route;
      Linux2 showed 192.168.250.12/24 with the corresponding directly
      connected route.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Recovered Codex records supplied during Part 6"
    limitations:
      - "These observations describe the historical query time, not current host state."
      - "Ping and password-SSH results were separately reported, not preserved as raw command output."

  - evidence_id: "E03"
    claim: "Historical active ZeroMQ endpoints used the dedicated sample-plane addresses and complementary ports."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      Linux1 listened on tcp://*:2000 and received from tcp://10.0.0.2:2001.
      Linux2 listened on tcp://*:2001 and received from tcp://10.0.0.1:2000.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Recovered Codex records supplied during Part 6"
    limitations:
      - "Endpoint observation does not prove current configuration or a current ZeroMQ run."

  - evidence_id: "E04"
    claim: "A clean Lab01 engineering candidate was historically reported as reviewed."
    evidence_type: "CODEX_REPORT"
    exact_observation: >-
      Linux1 candidate: device_name = zmq; tx_port = tcp://*:2000;
      rx_port = tcp://10.0.0.2:2001; base_srate = 23.04e6;
      nof_phy_threads = 1; sib_config = sib.conf. Scheduler candidate:
      pusch_max_mcs = 16; min_nof_ctrl_symbols = 1;
      max_nof_ctrl_symbols = 3. UE PCAP candidate: enable = none, with
      enable = mac retained only as an optional observation profile. The clean
      SIB source was matching-commit srsenb/sib.conf.example with SHA-256
      b781724b1c199e610e7f4d12b7963120c02d85da4389bccb9c5f8124ee0b57e9.
    directness: "REPORTED"
    confidence: "MEDIUM_HIGH"
    source_location: "Recovered Codex records supplied during Part 6"
    limitations:
      - "Clean candidate does not mean historically deployed baseline."
      - "Clean candidate is distinct from the historical active residue configuration."

  - evidence_id: "E05"
    claim: "Historical Lab01 recovery inspection observed Lab02/eMBMS configuration residue."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      Linux1 enb.conf selected sib_config = /etc/srsran/sib.conf.mbsfn.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Recovered Codex records and docs/audits/2026-07-10-rollback-inventory.md"
    limitations:
      - "Configuration residue is not Lab02 or eMBMS functional validation."
      - "File or field presence does not prove current active use."

  - evidence_id: "E06"
    claim: "The paired backup package and non-sensitive verification artifacts were observed."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      Paired backup evidence under
      /var/backups/5g-sdr/lab01-recovery/20260711-180201/ included COMPLETE
      markers. SHA-256 verification reported seven Linux1 non-sensitive config
      files and one Linux2 ue.conf file as OK, with source/destination metadata
      checks. Sensitive subscriber content was excluded.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Recovered Codex records supplied during Part 6"
    limitations:
      - "This TER does not copy configuration contents, credentials, or sensitive hashes."
      - "The backup path is historical and was not revalidated during R1."

  - evidence_id: "E07"
    claim: "Historical srsRAN_4G commit identity and dirty-tree state were observed on both hosts."
    evidence_type: "GIT"
    exact_observation: >-
      Linux1 and Linux2 ~/srsRAN_4G reported commit
      6bcbd9e5bf8686aa7085202cd847c5ddd64a9c16. Linux1 showed
      M srsenb/enb.conf.example and ?? build/. Linux2 showed
      M srsue/ue.conf.example and ?? build/.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Recovered Codex records supplied during Part 6"
    limitations:
      - "No diff contents were read."
      - "Commit identity does not mean pristine checkout or current source version."

  - evidence_id: "E08"
    claim: "Repository audit artifact paths and non-sensitive configuration hashes were inventoried."
    evidence_type: "FILE_ARTIFACT"
    exact_observation: >-
      The recovered inventory named docs/audits/2026-07-10-rollback-inventory.md,
      docs/audits/2026-07-10-config-tree.md, and
      docs/audits/2026-07-10-config-sha256.md. The rollback inventory preserves
