      service fields and selected PHY residue. The SHA-256 document preserves
      seven Linux1 and one Linux2 non-sensitive configuration hashes.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Recovered Codex records and current Repo audit artifacts"
    limitations:
      - "Repository file inventory is not current Runtime artifact validation."

  - evidence_id: "E09"
    claim: "Phase 4C bring-up, connectivity, shutdown, and evidence locator were reported later in the historical workstream."
    evidence_type: "HUMAN_OBSERVATION"
    exact_observation: >-
      Reported milestones included EPC to eNB to UE startup; srsepc, srsenb,
      and srsue initialization; ZeroMQ transport; cell search; Random Access;
      RRC Connected; Network Attach; UE 172.16.0.2 and EPC SGi 172.16.0.1;
      bounded bidirectional ICMP with 0% loss; UE to eNB to EPC shutdown; no
      /etc/srsran or persistent-network modification; and a historical locator
      at ~/5g-sdr-runtime-logs/.
    directness: "REPORTED"
    confidence: "MEDIUM"
    source_location: "Recovered Codex records supplied during Part 6"
    limitations:
      - "The recovered Codex thread did not contain Phase 4C process logs, raw ICMP output, service command output, or archive inventory."
      - "The current existence and contents of ~/5g-sdr-runtime-logs/ were not verified during R1."

