      - "Git network access and branch creation required sandbox escalation; no lab host was accessed."
  - evidence_id: "DS-02"
    claim: "The split preserves all baseline artifacts and technical evidence."
    evidence_type: "FILE_ARTIFACT"
    exact_observation: >-
      All 94 baseline tracked files remained at their original paths; 77 were byte-identical.
      The 17 edited baseline files were Markdown navigation or lifecycle surfaces.
      Byte comparison against start_head confirmed 64 protected artifacts unchanged, including
      student manual/config, canonical architecture/decisions/limitations, governance documents,
      all audits/reports/presentation payloads and existing TEH files.
      Original Lab prose remained intact; three Lab README heading levels were demoted only
      to nest legacy sections under their historical label. No renames or deletions occurred.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "git show start_head:path byte comparison and local files; docs/documentation-map.md"
    limitations:
      - "Byte preservation is not a new validation of the claims inside those artifacts."
  - evidence_id: "DS-03"
    claim: "Repository-local navigation checks passed."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      A local Python scan checked Markdown inline/reference link paths, decoded local targets and
      heading fragments while excluding fenced code and external URLs. All 60 Markdown files
      were scanned; final counts and publication outcome are recorded in the PR validation report.
      git diff --check passed. Manual diff review covered navigation, historical labels,
      core/optional boundaries and unchanged R5/NTN/Security status.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Local Markdown path/anchor scan, git diff review and git diff --check, 2026-09-12"
    limitations:
      - "No external URL availability check, browser rendering certification or Runtime validation."
      - "PR creation and Human acceptance are not inferred from pre-commit checks."

