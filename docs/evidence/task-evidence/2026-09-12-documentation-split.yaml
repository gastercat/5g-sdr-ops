      confirmed an ancestor of HEAD. The historical README checkpoint 885c610 was also an ancestor.
      git switch created docs/delivery-exploration-split before documentation writes.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "Local repository Git commands and GitHub origin main ref, 2026-09-12"
    limitations:
