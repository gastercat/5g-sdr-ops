      and UE IPv4 172.16.0.2. Bounded checks observed the expected runtime TUN addresses:
      Linux2 tun_srsue 172.16.0.2 and Linux1 srs_spgw_sgi 172.16.0.1.
    directness: "REPORTED"
    confidence: "HIGH"
    source_location: "2026-08-30 Codex EV-2 R3/R4 task observations"
    limitations:
      - "Successful attach and address assignment do not by themselves prove GTP-U forwarding or ICMP connectivity."

  - evidence_id: "E05"
    claim: "Original EV-2 R5 UE to EPC minimal ICMP failed。"
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      A single bounded command equivalent to ping -I tun_srsue -c 3 172.16.0.1
      transmitted 3 packets, received 0 packets, and reported 100% packet loss.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "2026-08-30 Codex EV-2 R5 task output"
    limitations:
      - "This establishes the failed UE to EPC ICMP attempt only; no reverse ICMP result was established in that attempt."
      - "It does not itself localize a root cause to UE TUN, bearer/GTP-U, SGi, return path, USB, or host networking."

  - evidence_id: "E06"
    claim: "EV-2 R6 controlled shutdown left srsepc, srsenb and srsue absent。"
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      Post-shutdown checks found no active srsepc or srsenb on Linux1 and no active
      srsue on Linux2. Runtime-created srs_spgw_sgi and tun_srsue later disappeared naturally.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "2026-08-30 Codex EV-2 post-failure shutdown verification"
    limitations:
      - "Human reported UE → eNB → EPC shutdown intent; exact per-stage order was not independently observed."

  - evidence_id: "E07"
    claim: "R5A counter observation was aborted before counters or a new R5 stimulus because Linux2 management became unreachable."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      After Human-reported UE startup and attach, two SSH attempts to 192.168.250.12:22
      timed out at 8 and 15 seconds. No R5A pre/post counter snapshots and no new
      3-packet UE to EPC ICMP stimulus were performed.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "2026-08-30 Codex R5A controlled runtime observation"
    limitations:
      - "Management loss was temporally associated with active UE runtime but did not establish a mechanism or causality."

  - evidence_id: "E08"
    claim: "Linux2 USB Ethernet incident was localized to USB/kernel device or physical-link layer."
    evidence_type: "LOG"
    exact_observation: >-
      Linux2 kernel evidence included USB disconnect, cdc_ether unregister of
      enxec9a0c14d470, descriptor/enumeration failures including error -71 and -32,
      and absence of the adapter from lsusb and /sys/class/net during failure.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "2026-08-30 Linux2 kernel and local network observations"
    limitations:
      - "The evidence supports USB device or physical-link-layer failure, not an exact hardware, connector, port, power, driver, or firmware root cause."
      - "It does not prove that the USB incident caused the original R5 ICMP failure."

  - evidence_id: "E09"
    claim: "Same-port physical replug recovered Linux2 USB enumeration, management and Sample Plane transport."
    evidence_type: "COMMAND_OUTPUT"
    exact_observation: >-
      Human performed a physical replug into the same USB port. The 35b5:3500 SZNX LAN
      100M device re-enumerated, cdc_ether recreated enxec9a0c14d470, Mac to Linux2
      management ICMP was 3/3, SSH succeeded, and Linux2 to Linux1 Sample Plane ICMP
      was 3/3 after Human restored temporary 10.0.0.2/24.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "2026-08-30 USB incident recovery checks"
    limitations:
      - "Same-port recovery is not proof of a permanent fix or adapter stability."

  - evidence_id: "E10"
    claim: "The historical USB disappearance was not reproduced during one complete 120-second UE-active observation window."
    evidence_type: "FILE_ARTIFACT"
    exact_observation: >-
      Local observer directory logs/usb-repro/20260830T212045+0800 covered
      2026-08-30 21:23:58 to 21:25:58 +08:00 with 120 samples and no material gap.
      Every sample retained USB 35b5:3500, enxec9a0c14d470, carrier 1, operstate up,
      192.168.250.12 and 10.0.0.2; matching USB/cdc_ether disconnect events were zero.
    directness: "PRIMARY"
    confidence: "HIGH"
    source_location: "2026-08-30 Linux2 local observer artifact; bounded controlled reproduction"
    limitations:
      - "One bounded non-reproduction does not establish that the issue is fixed or that the adapter is stable."
      - "It neither rules out a relationship to the historical incident nor resolves R5."

